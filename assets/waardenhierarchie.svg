 <circle cx="364" cy="557" r="3" fill="#6aa46f"/><text x="376" y="563" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21322d"><tspan x="376" dy="0">Besluitstappen</tspan><tspan x="376" dy="21">inzichtelijk maken</tspan></text><circle cx="364" cy="611" r="3" fill="#6aa46f"/><text x="376" y="617" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21322d"><tspan x="376" dy="0">Herbeoordeling</tspan><tspan x="376" dy="21">bereikbaar maken</tspan></text><circle cx="364" cy="665" r="3" fill="#6aa46f"/><text x="376" y="671" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21322d"><tspan x="376" dy="0">Geen sturende drempels</tspan></text><rect x="640" y="260" width="260" height="154" rx="16" fill="#eaf2e8" stroke="#bad1bd"/>
 <text x="660" y="287" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2e7653"><tspan x="660" dy="0">NORM</tspan></text>
 <text x="660" y="319" font-family="Georgia, serif" font-size="25" font-weight="700" fill="#064f3a"><tspan x="660" dy="0">Aansluiten op</tspan><tspan x="660" dy="29">de leefwereld</tspan></text>
 <text x="660" y="379" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#364c40"><tspan x="660" dy="0">Rekening houden met wat</tspan><tspan x="660" dy="22">iemand nodig heeft en kan.</tspan></text>
