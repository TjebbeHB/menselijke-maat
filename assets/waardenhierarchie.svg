 <text x="360" y="287" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2e7653"><tspan x="360" dy="0">NORM</tspan></text>
 <text x="360" y="319" font-family="Georgia, serif" font-size="25" font-weight="700" fill="#064f3a"><tspan x="360" dy="0">Begrijpen en</tspan><tspan x="360" dy="29">betwisten</tspan></text>
 <text x="360" y="379" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#364c40"><tspan x="360" dy="0">Een uitkomst kunnen volgen</tspan><tspan x="360" dy="22">en laten herzien.</tspan></text>
