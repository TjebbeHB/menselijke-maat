<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" role="img" aria-labelledby="title desc">
<title id="title">Waardenhiërarchie van de menselijke maat</title>
<desc id="desc">Menselijke maat is de waarde. Vier normen verbinden die waarde aan ontwerpkeuzes: luisteren en bijsturen, begrijpen en betwisten, aansluiten op de leefwereld en eenvoud. Voorbeelden zijn burgers laten meedenken, herbeoordeling bereikbaar maken, passende ondersteuning bieden en bewijsstukken beperken.</desc>
<rect width="1240" height="740" rx="24" fill="#fffaf4"/>
<rect x="402" y="34" width="436" height="124" rx="20" fill="#064f3a"/>
<text x="434" y="66" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#c5dec7"><tspan x="434" dy="0">WAARDE</tspan></text>
<text x="434" y="107" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#ffffff"><tspan x="434" dy="0">Menselijke maat</tspan></text>
<text x="434" y="136" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#eaf2e8"><tspan x="434" dy="0">Een rechtvaardig en begrijpelijk proces</tspan></text>
<path d="M620 158V213 M170 260V213H1070V260 M470 213V260 M770 213V260" fill="none" stroke="#6aa46f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
