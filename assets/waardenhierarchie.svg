 <text x="60" y="319" font-family="Georgia, serif" font-size="25" font-weight="700" fill="#064f3a"><tspan x="60" dy="0">Luisteren en</tspan><tspan x="60" dy="29">bijsturen</tspan></text>
 <text x="60" y="379" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#364c40"><tspan x="60" dy="0">Signalen van burgers</tspan><tspan x="60" dy="22">werken door in het ontwerp.</tspan></text>
 <path d="M170 414V463" stroke="#6aa46f" stroke-width="3"/>
 <circle cx="170" cy="463" r="5" fill="#6aa46f"/>
 <rect x="40" y="478" width="260" height="214" rx="16" fill="#fffefd" stroke="#e8e0d7"/>
