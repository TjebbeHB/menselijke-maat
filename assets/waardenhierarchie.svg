 <circle cx="664" cy="557" r="3" fill="#6aa46f"/><text x="676" y="563" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21322d"><tspan x="676" dy="0">Persoonlijke toelichting</tspan><tspan x="676" dy="21">toelaten</tspan></text><circle cx="664" cy="611" r="3" fill="#6aa46f"/><text x="676" y="617" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21322d"><tspan x="676" dy="0">Passende hulp bieden</tspan></text><circle cx="664" cy="644" r="3" fill="#6aa46f"/><text x="676" y="650" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#21322d"><tspan x="676" dy="0">Ervaringen vertalen</tspan><tspan x="676" dy="21">naar het proces</tspan></text><rect x="940" y="260" width="260" height="154" rx="16" fill="#eaf2e8" stroke="#bad1bd"/>
 <text x="960" y="287" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2e7653"><tspan x="960" dy="0">NORM</tspan></text>
 <text x="960" y="319" font-family="Georgia, serif" font-size="25" font-weight="700" fill="#064f3a"><tspan x="960" dy="0">Eenvoudig en</tspan><tspan x="960" dy="29">toegankelijk</tspan></text>
 <text x="960" y="379" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#364c40"><tspan x="960" dy="0">Weinig onnodige stappen,</tspan><tspan x="960" dy="22">bewijslast en voorkennis.</tspan></text>
